  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --teal: #1a5f5a; --teal-light: #2d8a84; --teal-dark: #0f3d3a; --amber: #e8a84a; --cream: #faf7f2; --warm-white: #fffdf9; --charcoal: #2c2c2c; --gray: #6b6b6b; --light-gray: #e8e4de; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--warm-white); border-bottom: 1px solid var(--light-gray); padding: 0 1.5rem; }
    nav .inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--teal); text-decoration: none; }
    .logo span { color: var(--amber); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .card { max-width: 520px; background: var(--warm-white); border: 1px solid var(--light-gray); border-radius: 20px; padding: 2.5rem; text-align: center; box-shadow: 0 8px 30px rgba(26,95,90,0.08); }
    h1 { font-family: 'Playfair Display', serif; color: var(--teal-dark); font-size: 1.8rem; margin-bottom: 0.8rem; }
    p { color: var(--gray); line-height: 1.7; margin-bottom: 1.2rem; }
    .btn { display: inline-block; background: var(--amber); color: var(--teal-dark); padding: 0.85rem 1.6rem; border-radius: 50px; text-decoration: none; font-weight: 700; }
    .btn:hover { background: #f4c97a; }
    footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: var(--gray); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --cream: #121212; --warm-white: #1a1a1a; --charcoal: #e8e4de; --gray: #b0aaa0; --light-gray: #333; --teal-dark: #7ec8c3; }
    }
    [data-theme="dark"] { --cream: #121212; --warm-white: #1a1a1a; --charcoal: #e8e4de; --gray: #b0aaa0; --light-gray: #333; --teal-dark: #7ec8c3; }
